<!doctype html>
<html lang="en">
  <head>
    <!-- Basic SEO -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Xuro Creative Labs | Code. Create. Captivate.</title>
    <meta
      name="description"
      content="At Xuro Creative Labs, we transform bold ideas into powerful digital experiences. We specialize in web & app development, UI/UX design, branding, and digital content creation for startups and businesses."
    />
    <meta
      name="keywords"
      content="Xuro Creative Labs, creative agency, web development, app development, UI/UX design, logo design, video editing, product photoshoot, branding, digital marketing, startup solutions, design agency, tech agency"
    />
    <meta name="author" content="Xuro Creative Labs" />

    <!-- Favicon + App Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/Xuro_icon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/Xuro_icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/Xuro_icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta
      property="og:title"
      content="Xuro Creative Labs | Code. Create. Captivate."
    />
    <meta
      property="og:description"
      content="Your full-stack creative partner crafting websites, apps, and brand experiences that drive business growth."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:url" content="https://xurocreativelabs.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Xuro Creative Labs" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Xuro Creative Labs | Code. Create. Captivate." />
    <meta
      name="twitter:description"
      content="Full-stack creative agency for web design, app development, branding, and digital content solutions."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Robots + Canonical -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://xurocreativelabs.vercel.app/" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Additional SEO for Google -->
    <meta name="application-name" content="Xuro Creative Labs" />
    <meta name="copyright" content="© 2025 Xuro Creative Labs" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
